<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت نام</title>
  </head>
  <body>
    <div class="containerr">
      <div class="form-box">
        <!-- <div class="form"> -->
        <h1>فرم ثبت نام</h1>
        <form>
          <div class="section">
            <div class="row">
              <div class="input-box">
                <label> نام و نام خانوادگی:</label>
                <input type="text" placeholder="نام خود را وارد کنید" />
                <input type="text" placeholder="نام خانوادگی را وارد کنید" />
              </div>
              <div class="input-box">
                <label> کدملی:</label>
                <input type="number" placeholder="" />
              </div>
            </div>
            <div class="row">
              <div class="input-box">
                <label>تاریخ تولد</label>
                <input type="date" />
              </div>
              <div class="input-box">
                <label> محل سکونت:</label>
                <input type="text" class="address" />
              </div>
            </div>

            <div class="row">
              <div class="input-box">
                <label for="number">شماره تماس:</label>
                <input type="number" placeholder="" />
              </div>
              <div class="input-box">
                <label>جنسیت:</label>
                <select name="gender">
                  <option value=""></option>
                  <option value="male">آقا</option>
                  <option value="female">خانم</option>
                  <option value="other">سایر</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="input-box">
                <label>ایمیل</label>
                <input type="email" placeholder="example@gmail.com " />
              </div>
              <div class="input-box">
                <label for="password">رمز عبور</label>
                <input type="password" placeholder="رمز عبور خودرا وارد کنید" />
              </div>
            </div>
            <!-- </div>
           </div>   -->
          </div>
          <div class="section">
            <div class="ed">
              <h3>اطلاعات تحصیلی:</h3>
              <div class="row">
                <div class="input-box">
                  <label>رشته تحصیلی</label>
                  <input type="text" />
                </div>

                <div class="input-box">
                  <label>مقطع تحصیلی</label>
                  <select>
                    <option>انتخاب کنید</option>
                    <option>دیپلم</option>
                    <option>کاردانی</option>
                    <option>کارشناسی</option>
                    <option>کارشناسی ارشد</option>
                  </select>
                </div>

                <!-- <div class="input-box">
                  <label>نام دانشگاه/موسسه آموزشی</label>
                  <input type="text" />
                </div> -->
              </div>
            </div>
          </div>
          <div class="submit">
            <button type="submit">ثبت نام</button>
          </div>
        </form>
      </div>
    </div>
    <!-- </div> -->
  </body>
</html>
