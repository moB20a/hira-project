    <title>نظر کاربران</title>
  </head>
  <body>
    
  <body>
    <section class="comments" id="comments">
      <h2>
        نظرات کاربران
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="100"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-message-square-text"
        >
          <path
            d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"
          />
          <path d="M7 11h10" />
          <path d="M7 15h6" />
          <path d="M7 7h8" />
        </svg>
      </h2>
      <div class="comment-items">
        <figure class="comment-item">
          <figcaption class="comment-item-text">
            <h3>— پیمان</h3>
            <div class="stars">⭐⭐⭐⭐⭐</div>
            <p>
              اولبن چیزی که درهیرا توجه منو جلب کرد کیفیت خوب غذاها بود.چیزی که
              دوست داشتم این بود که کیفیت غذاهادر کنار قیمت مناسب حفظ شده بود.
              قطعا یکی از انتخاب های همیشگی من برای یک غذای خوشمزه هیرا خواهد
              بود.
            </p>
          </figcaption>
        </figure>
        <figure class="comment-item">
          <figcaption class="comment-item-text">
            <h3>— فاطمه</h3>
            <div class="stars">⭐⭐⭐⭐</div>
            <p>
              هیرا فقط یک فست فود معمولی نیست؛چیزی که باعث میشه دوباره بهش سر
              بزنم,کیفیت عالی,تنوع و طعم خوب غذاهاست.فضای خوب و عالی و برخورد
              مناسب هم تجربه سفارش رو کامل تر میکنه. امیدوارم همین کیفیت همیشه
              ادامه داشته باشه.
            </p>
          </figcaption>
        </figure>

        <figure class="comment-item">
          <figcaption class="comment-item-text">
            <h3>— نوید</h3>
            <div class="stars">⭐⭐</div>

            <p>
              سفارش من با تأخیر زیادی به دستم رسید و متأسفانه غذا سرد شده بود.
              انتظار داشتم با این قیمت، سرویس‌دهی سریع‌تر باشه. کیفیت طعم غذا
              خوب بود ولی وقتی سرد به دستم رسید، اون لذت اصلی رو نداشت. امیدوارم
              در بحث زمان‌بندی ارسال بیشتر دقت کنید.»
            </p>
          </figcaption>
        </figure>
        <figure class="comment-item">
          <figcaption class="comment-item-text">
            <h3>— سپهر راد</h3>
            <div class="stars">⭐⭐⭐</div>

            <p>
              «کیفیت پیتزا خوب و خوش‌طعم بود، ولی حجمش نسبت به قیمتی که پرداخت
              کردم واقعاً کم بود. فکر می‌کردم سایز بزرگ‌تر باشه اما در حد یک
              وعده معمولی هم نبود. به نظرم اگر قیمت‌ها کمی تعدیل بشه یا حجم رو
              بیشتر کنید، منصفانه‌تره و مشتری‌های ثابت بیشتری خواهید داشت.»
            </p>
          </figcaption>
        </figure>
        <figure class="comment-item">
          <figcaption class="comment-item-text">
            <h3>— مهدی</h3>
            <div class="stars">⭐⭐⭐⭐⭐</div>

            <p>
              یک فست‌فود باکیفیت که همه‌چیزش سر جای خودش قرار داره. بسته‌بندی
              غذا خیلی مرتب و بهداشتی بود و خیلی سریع هم به دستم رسید. حس می‌کنم
              واقعاً برای مشتری ارزش قائل هستن و همین موضوع باعث میشه با خیال
              راحت دوباره خرید کنم.»
            </p>
          </figcaption>
        </figure>
        <div class="send">
          <span>ارسال پیام</span>
          <div class="form-row">
            <input type="text" placeholder="نام شما" />
            <input type="email" placeholder="پست الکترونیک" />
          </div>
          <div class="comment-box">
            <textarea placeholder="متن پیام"></textarea>
          </div>
          <div class="comment-section">
            <button type="submit">ارسال پیام</button>
          </div>
        </div>
      </div>
    </section>
  </body>
