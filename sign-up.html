<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./stylee.css" />
    <title>sign-up</title>
  </head>
  <body>
    <div class="text">
      <h1>sign-up Form</h1>

      <p>
        Create your account and join us to explore everything we have to offer.
        Discover new experiences and enjoy a more personalized experience along
        the way.
      </p>
    </div>

    <div class="sign-card">
      <form>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="number" placeholder=" " />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="enter your password" />
        </div>

        <div class="form-group">
          <label>Gender</label>

          <div class="gender-options">
            <label for="select"></label>
            <select>
              <option>select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Place of Residence</label>

          <select>
            <option>Select your city</option>
            <option>Tehran</option>
            <option>Shiraz</option>
            <option>Isfahan</option>
            <option>Other</option>
          </select>
        </div>

        <!-- Education -->
        <div class="form-group">
          <label>Education Information</label>

          <select>
            <option>Select your education level</option>
            <option>High School</option>
            <option>Diploma</option>
            <option>Bachelor's Degree</option>
            <option>Master's Degree</option>
            <option>PhD</option>
          </select>
        </div>

        <button type="submit">Send</button>
      </form>
    </div>
  </body>
</html>
